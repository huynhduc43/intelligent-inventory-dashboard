        margin-bottom: 0.5rem;

        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--color-ink);
        margin-bottom: 1.5rem;
      }
      svg {
        width: 100%;
        min-width: 960px;
        display: block;
      }
      @media print {
        .diagram-container {
          overflow-x: visible;
        }
        svg {
          min-width: 0;
        }
      }

              font-family="'Geist Mono', monospace"
              text-anchor="middle"

            <!-- SQL panel: the one write -->
            <rect

              y="748"
              width="480"
              height="124"
              rx="6"
              fill="#ffffff"

            <text
              x="112"
              y="768"
              fill="#4f5d75"
              font-size="7"
              font-family="'Geist Mono', monospace"
              letter-spacing="0.14em"
            >
              THE CONDITIONAL UPDATE
            </text>
            <g
              fill="#2d3142"
              font-size="9"
              font-family="'Geist Mono', monospace"
            >
              <text x="112" y="788">UPDATE vehicle</text>
              <text x="128" y="802">
                SET status = $target, updated_by = $user, updated_at = $now,
              </text>
              <text x="150" y="816">
                sold_at = CASE WHEN $target = 'SOLD' THEN $now ELSE sold_at END
              </text>
              <text x="117" y="830">WHERE id = $v AND dealership_id = $d</text>
              <text x="128" y="844">AND status = ANY($allowedFrom)</text>
              <text x="112" y="858">RETURNING id</text>
            </g>

            <!-- Callout -->
            <text
              x="608"
              y="768"
              fill="#2d3142"
              font-size="14"
              font-style="italic"
              font-family="'Instrument Serif', serif"

              $now comes from the injected Clock.
            </text>
            <text
              x="608"
              y="796"
              fill="#2d3142"
              font-size="14"
              font-style="italic"
              font-family="'Instrument Serif', serif"

              No locks, no transaction: a concurrent
            </text>
            <text
              x="608"
              y="814"
              fill="#2d3142"
              font-size="14"
              font-style="italic"
              font-family="'Instrument Serif', serif"
            >
              writer blocked on the row lock re-checks
            </text>
            <text
              x="608"
              y="832"
              fill="#2d3142"
              font-size="14"
              font-style="italic"
              font-family="'Instrument Serif', serif"
            >
              the WHERE after the first one commits.
            </text>

            <line

            <text

              LEGEND
            </text>
            <line

            <text

            <text

            <line

            <text
