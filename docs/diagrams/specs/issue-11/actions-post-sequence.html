        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;

        margin-bottom: 1.5rem;

        width: 100%;
        min-width: 1280px;
        display: block;
      }
      @media print {
        .diagram-container {
          overflow-x: visible;
        }
        svg {
          min-width: 0;

      }
