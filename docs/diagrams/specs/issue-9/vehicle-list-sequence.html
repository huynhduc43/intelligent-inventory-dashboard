        font-weight: 400;
        letter-spacing: -0.02em;

        color: var(--color-ink);
        margin-bottom: 1.5rem;
      }

        width: 100%;
        min-width: 1360px;
        display: block;
      }
      @media print {
        .diagram-container {
          overflow-x: visible;
        }
        svg {
          min-width: 0;
        }
      }
    </style>
