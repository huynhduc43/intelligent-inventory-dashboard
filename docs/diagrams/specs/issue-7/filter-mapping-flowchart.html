<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exception to problem</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-paper: #f5f5f5;
        --color-ink: #2d3142;
        --color-muted: #4f5d75;
        --color-accent: #bf4520;
        --font-sans: 'Geist', system-ui, sans-serif;
        --font-serif: 'Instrument Serif', serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 2rem;
      }
      .frame {
        max-width: 1200px;
        width: 100%;
      }
      .diagram-container {
        width: 100%;
        overflow-x: auto;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--color-ink);
        margin-bottom: 1.5rem;
      }
      svg {
        width: 100%;
        min-width: 960px;
        display: block;
      }
      @media print {
        .diagram-container {
          overflow-x: visible;
        }
        svg {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">Flowchart · Issue #7</p>
      <h1>How the filter turns an exception into a problem</h1>

      <div class="diagram-container">
        <svg
          viewBox="0 0 960 768"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-labelledby="filter-mapping-flowchart-title filter-mapping-flowchart-desc"
        >
          <title id="filter-mapping-flowchart-title">
            How the filter turns an exception into a problem
          </title>
          <desc id="filter-mapping-flowchart-desc">
            The global ProblemDetailsFilter only ends the response if headers
            are already sent; otherwise a malformed JSON body gets a fixed 400
            detail, an HttpException keeps its status, code and message, and
            anything else becomes 500 INTERNAL, and all three are written as one
            problem+json shape.
          </desc>
          <defs>
            <marker
              id="arrow"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
            </marker>
            <marker
              id="arrow-accent"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <polygon points="0 0, 8 3, 0 6" fill="#bf4520" />
            </marker>
          </defs>

          <rect width="100%" height="100%" fill="#f5f5f5" />

          <!-- ARROWS (before nodes) -->
          <!-- start → D1 -->
          <line
            x1="480"
            y1="80"
            x2="480"
            y2="106"
            stroke="#4f5d75"
            stroke-width="1.2"
            marker-end="url(#arrow)"
          />
          <!-- D1 yes → res.end -->
          <line
            x1="600"
            y1="148"
            x2="698"
            y2="148"
            stroke="#4f5d75"
            stroke-width="1.2"
            marker-end="url(#arrow)"
          />
          <rect x="634" y="128" width="32" height="12" rx="2" fill="#f5f5f5" />
          <text
            x="650"
            y="137"
            fill="#4f5d75"
            font-size="8"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
            letter-spacing="0.08em"
          >
            YES
          </text>
          <!-- D1 no → D2 -->
          <line
            x1="480"
            y1="188"
            x2="480"
            y2="234"
            stroke="#4f5d75"
            stroke-width="1.2"
            marker-end="url(#arrow)"
          />
          <rect x="490" y="205" width="24" height="12" rx="2" fill="#f5f5f5" />
          <text
            x="502"
            y="214"
            fill="#4f5d75"
            font-size="8"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
            letter-spacing="0.08em"
          >
            NO
          </text>
          <!-- D2 left → A (bad JSON) -->
          <line
            x1="360"
            y1="276"
            x2="258"
            y2="276"
            stroke="#4f5d75"
            stroke-width="1.2"
            marker-end="url(#arrow)"
          />
          <rect x="268" y="258" width="80" height="12" rx="2" fill="#f5f5f5" />
          <text
            x="308"
            y="267"
            fill="#4f5d75"
            font-size="8"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
            letter-spacing="0.08em"
          >
            BAD JSON BODY
          </text>
          <!-- D2 right → C (other) -->
          <line
            x1="600"
            y1="276"
            x2="702"
            y2="276"
            stroke="#4f5d75"
            stroke-width="1.2"
            marker-end="url(#arrow)"
          />
          <rect x="616" y="258" width="72" height="12" rx="2" fill="#f5f5f5" />
          <text
            x="652"
            y="267"
            fill="#4f5d75"
            font-size="8"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
            letter-spacing="0.08em"
          >
            ANYTHING ELSE
          </text>
          <!-- D2 down → B (HttpException) -->
          <line
            x1="480"
            y1="316"
            x2="480"
            y2="354"
            stroke="#4f5d75"
            stroke-width="1.2"
            marker-end="url(#arrow)"
          />
          <rect x="490" y="329" width="84" height="12" rx="2" fill="#f5f5f5" />
          <text
            x="532"
            y="338"
            fill="#4f5d75"
            font-size="8"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
            letter-spacing="0.08em"
          >
            HTTPEXCEPTION
          </text>
          <!-- A → write -->
          <path
            d="M 148 308 L 148 548 Q 148 556 156 556 L 278 556"
            fill="none"
            stroke="#4f5d75"
            stroke-width="1.2"
            marker-end="url(#arrow)"
          />
          <!-- C → write -->
          <path
            d="M 812 308 L 812 548 Q 812 556 804 556 L 682 556"
            fill="none"
            stroke="#4f5d75"
            stroke-width="1.2"
            marker-end="url(#arrow)"
          />
          <!-- B → write -->
          <line
            x1="480"
            y1="452"
            x2="480"
            y2="494"
            stroke="#4f5d75"
            stroke-width="1.2"
            marker-end="url(#arrow)"
          />

          <!-- NODES -->
          <!-- Start (oval) -->
          <rect x="352" y="32" width="256" height="48" rx="20" fill="#f5f5f5" />
          <rect
            x="352"
            y="32"
            width="256"
            height="48"
            rx="20"
            fill="#ffffff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <text
            x="480"
            y="53"
            fill="#2d3142"
            font-size="12"
            font-weight="600"
            font-family="'Geist', sans-serif"
            text-anchor="middle"
          >
            Exception reaches the filter
          </text>
          <text
            x="480"
            y="68"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            ProblemDetailsFilter · APP_FILTER
          </text>

          <!-- D1 -->
          <polygon
            points="480,108 600,148 480,188 360,148"
            fill="#ffffff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <text
            x="480"
            y="152"
            fill="#2d3142"
            font-size="12"
            font-weight="600"
            font-family="'Geist', sans-serif"
            text-anchor="middle"
          >
            Headers already sent?
          </text>

          <!-- res.end (oval end) -->
          <rect
            x="700"
            y="128"
            width="200"
            height="40"
            rx="20"
            fill="#f5f5f5"
          />
          <rect
            x="700"
            y="128"
            width="200"
            height="40"
            rx="20"
            fill="#ffffff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <text
            x="800"
            y="146"
            fill="#2d3142"
            font-size="12"
            font-weight="600"
            font-family="'Geist', sans-serif"
            text-anchor="middle"
          >
            res.end() only
          </text>
          <text
            x="800"
            y="159"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            no body written
          </text>

          <!-- D2 -->
          <polygon
            points="480,236 600,276 480,316 360,276"
            fill="#ffffff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <text
            x="480"
            y="280"
            fill="#2d3142"
            font-size="12"
            font-weight="600"
            font-family="'Geist', sans-serif"
            text-anchor="middle"
          >
            Which exception?
          </text>

          <!-- A: malformed JSON -->
          <rect x="40" y="244" width="216" height="64" rx="6" fill="#f5f5f5" />
          <rect
            x="40"
            y="244"
            width="216"
            height="64"
            rx="6"
            fill="#ffffff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <text
            x="148"
            y="266"
            fill="#2d3142"
            font-size="12"
            font-weight="600"
            font-family="'Geist', sans-serif"
            text-anchor="middle"
          >
            400 · fixed detail
          </text>
          <text
            x="148"
            y="282"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            "Request body is not valid JSON."
          </text>
          <text
            x="148"
            y="296"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            parser text never sent
          </text>

          <!-- C: unknown error -->
          <rect x="704" y="244" width="216" height="64" rx="6" fill="#f5f5f5" />
          <rect
            x="704"
            y="244"
            width="216"
            height="64"
            rx="6"
            fill="#ffffff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <text
            x="812"
            y="266"
            fill="#2d3142"
            font-size="12"
            font-weight="600"
            font-family="'Geist', sans-serif"
            text-anchor="middle"
          >
            500 · INTERNAL
          </text>
          <text
            x="812"
            y="282"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            "An unexpected error occurred."
          </text>
          <text
            x="812"
            y="296"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            no internals in the body
          </text>

          <!-- B: HttpException -->
          <rect x="320" y="356" width="320" height="96" rx="6" fill="#f5f5f5" />
          <rect
            x="320"
            y="356"
            width="320"
            height="96"
            rx="6"
            fill="#ffffff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <text
            x="480"
            y="378"
            fill="#2d3142"
            font-size="12"
            font-weight="600"
            font-family="'Geist', sans-serif"
            text-anchor="middle"
          >
            Its status, code and detail
          </text>
          <text
            x="480"
            y="396"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            code: its own › §4.8 table › HTTP_&lt;status&gt;
          </text>
          <text
            x="480"
            y="410"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            4xx detail: the exception message
          </text>
          <text
            x="480"
            y="424"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            zod pipe: VALIDATION_FAILED + errors[]
          </text>
          <text
            x="480"
            y="438"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            e.g. 413 from the parser → HTTP_413
          </text>

          <!-- Write problem+json (focal) -->
          <rect
            x="280"
            y="496"
            width="400"
            height="120"
            rx="6"
            fill="#f5f5f5"
          />
          <rect
            x="280"
            y="496"
            width="400"
            height="120"
            rx="6"
            fill="rgba(191,69,32,0.08)"
            stroke="#bf4520"
            stroke-width="1"
          />
          <text
            x="480"
            y="520"
            fill="#2d3142"
            font-size="12"
            font-weight="600"
            font-family="'Geist', sans-serif"
            text-anchor="middle"
          >
            Write application/problem+json
          </text>
          <text
            x="480"
            y="538"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            type = …/problems/&lt;kebab-code&gt; · code
          </text>
          <text
            x="480"
            y="552"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            title = status phrase · status · detail
          </text>
          <text
            x="480"
            y="566"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            instance = urn:request:&lt;req.id&gt;
          </text>
          <text
            x="480"
            y="580"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            errors[{pointer, message}] for VALIDATION_FAILED
          </text>
          <text
            x="480"
            y="600"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
          >
            status ≥ 500 → res.err = exception (stack in log)
          </text>

          <!-- CALLOUT -->
          <text
            x="40"
            y="656"
            fill="#2d3142"
            font-size="14"
            font-style="italic"
            font-family="'Instrument Serif', serif"
          >
            HealthController's 503 never gets here: its own passthrough
          </text>
          <text
            x="40"
            y="674"
            fill="#2d3142"
            font-size="14"
            font-style="italic"
            font-family="'Instrument Serif', serif"
          >
            filter writes Terminus's body unchanged (ADR 0003).
          </text>

          <!-- LEGEND -->
          <line
            x1="40"
            y1="704"
            x2="920"
            y2="704"
            stroke="rgba(45,49,66,0.10)"
            stroke-width="0.8"
          />
          <text
            x="40"
            y="720"
            fill="#4f5d75"
            font-size="8"
            font-family="'Geist Mono', monospace"
            letter-spacing="0.18em"
          >
            LEGEND
          </text>

          <rect
            x="40"
            y="736"
            width="24"
            height="12"
            rx="6"
            fill="#ffffff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <text
            x="72"
            y="745"
            fill="#4f5d75"
            font-size="8.5"
            font-family="'Geist', sans-serif"
          >
            Start / end
          </text>

          <polygon
            points="160,734 172,742 160,750 148,742"
            fill="#ffffff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <text
            x="180"
            y="745"
            fill="#4f5d75"
            font-size="8.5"
            font-family="'Geist', sans-serif"
          >
            Decision
          </text>

          <rect
            x="248"
            y="736"
            width="20"
            height="12"
            rx="2"
            fill="#ffffff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <text
            x="276"
            y="745"
            fill="#4f5d75"
            font-size="8.5"
            font-family="'Geist', sans-serif"
          >
            Outcome
          </text>

          <rect
            x="352"
            y="736"
            width="20"
            height="12"
            rx="2"
            fill="rgba(191,69,32,0.08)"
            stroke="#bf4520"
            stroke-width="1"
          />
          <text
            x="380"
            y="745"
            fill="#4f5d75"
            font-size="8.5"
            font-family="'Geist', sans-serif"
          >
            One response shape
          </text>
        </svg>
      </div>
    </div>
  </body>
</html>
