<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vehicle status lifecycle</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-paper: #f5f5f5;
        --color-ink: #2d3142;
        --color-muted: #4f5d75;
        --color-accent: #bf4520;
        --font-sans: 'Geist', system-ui, sans-serif;
        --font-serif: 'Instrument Serif', serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 2rem;
      }
      .frame {
        max-width: 1200px;
        width: 100%;
      }
      .diagram-container {
        width: 100%;
        overflow-x: auto;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--color-ink);
        margin-bottom: 1.5rem;
      }
      svg {
        width: 100%;
        min-width: 960px;
        display: block;
      }
      @media print {
        .diagram-container {
          overflow-x: visible;
        }
        svg {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">State machine · Issue #13</p>
      <h1>Vehicle status lifecycle</h1>

      <div class="diagram-container">
        <svg
          viewBox="0 0 960 504"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-labelledby="vehicle-lifecycle-title vehicle-lifecycle-desc"
        >
          <title id="vehicle-lifecycle-title">Vehicle status lifecycle</title>
          <desc id="vehicle-lifecycle-desc">
            A vehicle is created IN_STOCK, can be reserved and released between
            IN_STOCK and RESERVED, and is sold from either into the terminal
            SOLD state, which sets sold_at; every other transition, including
            same-state, returns 409 INVALID_TRANSITION.
          </desc>
          <defs>
            <pattern
              id="dots"
              width="22"
              height="22"
              patternUnits="userSpaceOnUse"
            >
              <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)" />
            </pattern>
            <marker
              id="arrow"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
            </marker>
            <marker
              id="arrow-accent"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <polygon points="0 0, 8 3, 0 6" fill="#bf4520" />
            </marker>
          </defs>

          <rect width="100%" height="100%" fill="#f5f5f5" />
          <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55" />

          <g transform="translate(0,-96)">
            <!-- Transitions (drawn first) -->
            <!-- Start → IN_STOCK -->
            <line
              x1="56"
              y1="200"
              x2="140"
              y2="200"
              stroke="#4f5d75"
              stroke-width="1.2"
              marker-end="url(#arrow)"
            />
            <!-- IN_STOCK → RESERVED -->
            <line
              x1="320"
              y1="188"
              x2="560"
              y2="188"
              stroke="#4f5d75"
              stroke-width="1.2"
              marker-end="url(#arrow)"
            />
            <!-- RESERVED → IN_STOCK -->
            <line
              x1="560"
              y1="212"
              x2="320"
              y2="212"
              stroke="#4f5d75"
              stroke-width="1.2"
              marker-end="url(#arrow)"
            />
            <!-- IN_STOCK → SOLD (elbow) -->
            <path
              d="M 230 240 L 230 372 Q 230 380 238 380 L 360 380"
              fill="none"
              stroke="#4f5d75"
              stroke-width="1.2"
              marker-end="url(#arrow)"
            />
            <!-- RESERVED → SOLD (elbow) -->
            <path
              d="M 650 240 L 650 372 Q 650 380 642 380 L 540 380"
              fill="none"
              stroke="#4f5d75"
              stroke-width="1.2"
              marker-end="url(#arrow)"
            />
            <!-- SOLD → end -->
            <line
              x1="450"
              y1="420"
              x2="450"
              y2="452"
              stroke="#4f5d75"
              stroke-width="1.2"
              marker-end="url(#arrow)"
            />

            <!-- Transition labels -->
            <rect x="74" y="178" width="48" height="12" rx="2" fill="#f5f5f5" />
            <text
              x="98"
              y="187"
              fill="#4f5d75"
              font-size="8"
              font-family="'Geist Mono', monospace"
              text-anchor="middle"
              letter-spacing="0.08em"
            >
              CREATE
            </text>

            <rect
              x="404"
              y="166"
              width="72"
              height="12"
              rx="2"
              fill="#f5f5f5"
            />
            <text
              x="440"
              y="175"
              fill="#4f5d75"
              font-size="8"
              font-family="'Geist Mono', monospace"
              text-anchor="middle"
              letter-spacing="0.08em"
            >
              RESERVE
            </text>

            <rect
              x="404"
              y="222"
              width="72"
              height="12"
              rx="2"
              fill="#f5f5f5"
            />
            <text
              x="440"
              y="231"
              fill="#4f5d75"
              font-size="8"
              font-family="'Geist Mono', monospace"
              text-anchor="middle"
              letter-spacing="0.08em"
            >
              RELEASE
            </text>

            <rect
              x="268"
              y="358"
              width="56"
              height="12"
              rx="2"
              fill="#f5f5f5"
            />
            <text
              x="296"
              y="367"
              fill="#4f5d75"
              font-size="8"
              font-family="'Geist Mono', monospace"
              text-anchor="middle"
              letter-spacing="0.08em"
            >
              SELL
            </text>

            <rect
              x="568"
              y="358"
              width="56"
              height="12"
              rx="2"
              fill="#f5f5f5"
            />
            <text
              x="596"
              y="367"
              fill="#4f5d75"
              font-size="8"
              font-family="'Geist Mono', monospace"
              text-anchor="middle"
              letter-spacing="0.08em"
            >
              SELL
            </text>

            <!-- Start dot -->
            <circle cx="48" cy="200" r="6" fill="#2d3142" />

            <!-- State: IN_STOCK -->
            <rect
              x="140"
              y="160"
              width="180"
              height="80"
              rx="8"
              fill="#ffffff"
              stroke="#2d3142"
              stroke-width="1"
            />
            <rect
              x="148"
              y="168"
              width="40"
              height="12"
              rx="2"
              fill="transparent"
              stroke="rgba(45,49,66,0.40)"
              stroke-width="0.8"
            />
            <text
              x="168"
              y="177"
              fill="#2d3142"
              font-size="7"
              font-family="'Geist Mono', monospace"
              text-anchor="middle"
              letter-spacing="0.08em"
            >
              STATE
            </text>
            <text
              x="230"
              y="208"
              fill="#2d3142"
              font-size="14"
              font-weight="600"
              font-family="'Geist', sans-serif"
              text-anchor="middle"
            >
              IN_STOCK
            </text>
            <text
              x="230"
              y="224"
              fill="#4f5d75"
              font-size="9"
              font-family="'Geist Mono', monospace"
              text-anchor="middle"
            >
              actions loggable
            </text>

            <!-- State: RESERVED -->
            <rect
              x="560"
              y="160"
              width="180"
              height="80"
              rx="8"
              fill="#ffffff"
              stroke="#2d3142"
              stroke-width="1"
            />
            <rect
              x="568"
              y="168"
              width="40"
              height="12"
              rx="2"
              fill="transparent"
              stroke="rgba(45,49,66,0.40)"
              stroke-width="0.8"
            />
            <text
              x="588"
              y="177"
              fill="#2d3142"
              font-size="7"
              font-family="'Geist Mono', monospace"
              text-anchor="middle"
              letter-spacing="0.08em"
            >
              STATE
            </text>
            <text
              x="650"
              y="208"
              fill="#2d3142"
              font-size="14"
              font-weight="600"
              font-family="'Geist', sans-serif"
              text-anchor="middle"
            >
              RESERVED
            </text>
            <text
              x="650"
              y="224"
              fill="#4f5d75"
              font-size="9"
              font-family="'Geist Mono', monospace"
              text-anchor="middle"
            >
              no new actions
            </text>

            <!-- State: SOLD (focal, terminal) -->
            <rect
              x="360"
              y="340"
              width="180"
              height="80"
              rx="8"
              fill="rgba(191,69,32,0.08)"
              stroke="#bf4520"
              stroke-width="1"
            />
            <rect
              x="368"
              y="348"
              width="56"
              height="12"
              rx="2"
              fill="transparent"
              stroke="rgba(191,69,32,0.50)"
              stroke-width="0.8"
            />
            <text
              x="396"
              y="357"
              fill="#bf4520"
              font-size="7"
              font-family="'Geist Mono', monospace"
              text-anchor="middle"
              letter-spacing="0.08em"
            >
              TERMINAL
            </text>
            <text
              x="450"
              y="388"
              fill="#2d3142"
              font-size="14"
              font-weight="600"
              font-family="'Geist', sans-serif"
              text-anchor="middle"
            >
              SOLD
            </text>
            <text
              x="450"
              y="404"
              fill="#4f5d75"
              font-size="9"
              font-family="'Geist Mono', monospace"
              text-anchor="middle"
            >
              sets sold_at = $now
            </text>

            <!-- End ring -->
            <circle
              cx="450"
              cy="460"
              r="8"
              fill="none"
              stroke="#2d3142"
              stroke-width="1"
            />
            <circle cx="450" cy="460" r="5" fill="#2d3142" />

            <!-- Callouts -->
            <text
              x="48"
              y="512"
              fill="#2d3142"
              font-size="15"
              font-style="italic"
              font-family="'Instrument Serif', serif"
            >
              Any other transition, same-state included (IN_STOCK → IN_STOCK,
              SOLD → anything), is 409 INVALID_TRANSITION.
            </text>
            <text
              x="48"
              y="534"
              fill="#2d3142"
              font-size="15"
              font-style="italic"
              font-family="'Instrument Serif', serif"
            >
              Actions can be logged only while the vehicle is IN_STOCK.
            </text>

            <!-- Legend -->
            <line
              x1="48"
              y1="556"
              x2="912"
              y2="556"
              stroke="rgba(45,49,66,0.10)"
              stroke-width="0.8"
            />
            <text
              x="48"
              y="574"
              fill="#4f5d75"
              font-size="8"
              font-family="'Geist Mono', monospace"
              letter-spacing="0.18em"
            >
              LEGEND
            </text>
            <circle cx="132" cy="571" r="5" fill="#2d3142" />
            <text
              x="144"
              y="574"
              fill="#4f5d75"
              font-size="8.5"
              font-family="'Geist', sans-serif"
            >
              Start (create)
            </text>
            <circle
              cx="236"
              cy="571"
              r="7"
              fill="none"
              stroke="#2d3142"
              stroke-width="1"
            />
            <circle cx="236" cy="571" r="4" fill="#2d3142" />
            <text
              x="250"
              y="574"
              fill="#4f5d75"
              font-size="8.5"
              font-family="'Geist', sans-serif"
            >
              End
            </text>
            <rect
              x="292"
              y="566"
              width="14"
              height="10"
              rx="2"
              fill="#ffffff"
              stroke="#2d3142"
              stroke-width="1"
            />
            <text
              x="312"
              y="574"
              fill="#4f5d75"
              font-size="8.5"
              font-family="'Geist', sans-serif"
            >
              State
            </text>
            <rect
              x="364"
              y="566"
              width="14"
              height="10"
              rx="2"
              fill="rgba(191,69,32,0.08)"
              stroke="#bf4520"
              stroke-width="1"
            />
            <text
              x="384"
              y="574"
              fill="#4f5d75"
              font-size="8.5"
              font-family="'Geist', sans-serif"
            >
              Terminal state
            </text>
            <line
              x1="456"
              y1="571"
              x2="484"
              y2="571"
              stroke="#4f5d75"
              stroke-width="1.2"
              marker-end="url(#arrow)"
            />
            <text
              x="492"
              y="574"
              fill="#4f5d75"
              font-size="8.5"
              font-family="'Geist', sans-serif"
            >
              Allowed transition
            </text>
          </g>
        </svg>
      </div>
    </div>
  </body>
</html>
